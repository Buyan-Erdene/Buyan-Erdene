<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSS Parser</title>
</head>
<body>
    <h1>RSS Data Parser</h1>
    <button id="fetchRss">Fetch and Save RSS</button>
    <p id="status"></p>

    <script>
        const proxyUrl = 'https://cors-anywhere.herokuapp.com/';
const targetUrl = 'https://ikon.mn/rss';

document.getElementById("fetchRss").addEventListener("click", async () => {
    const status = document.getElementById("status");
    status.textContent = "Fetching RSS data...";
    try {
        const response = await fetch(proxyUrl + targetUrl);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const rssData = await response.text();
        const blob = new Blob([rssData], { type: "application/xml" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "text.xml";
        link.click();

        status.textContent = "RSS data saved as text.xml.";
    } catch (error) {
        console.error("Error fetching or saving RSS data:", error);
        status.textContent = "Failed to fetch or save RSS data.";
    }
});

    </script>
</body>
</html>
